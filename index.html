<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js ar - hit test</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link type="text/css" rel="stylesheet" href="main.css">

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js">
	</script>
	<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
	<script>
		eruda.init();
	</script>


</head>

<body>

	<div id="content">
		<div id="mySidenav" class="sidenav">
			<a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
			<a class="ar-object" id="1" href="#">item_1</a>
			<a class="ar-object" id="2" href="#">item_2</a>
			<a class="ar-object" id="3" href="#">item_3</a>
			<a class="ar-object" id="4" href="#">item_4</a>
		</div>
		<div id="container" style="position: fixed;"></div>
		<span style="font-size:30px;cursor:pointer;position: absolute;" onclick="openNav()">&#9776; open</span>
		<button type="button" id="place-button">PLACE</button>
		<button type="button" id="add-button">ADD</button>
		<button type="button" id="clear-button">CLEAR</button>
	</div>


	<script>
		function openNav() {
			document.getElementById("mySidenav").style.width = "250px";
		}
		function closeNav() {
			document.getElementById("mySidenav").style.width = "0";
		}
	</script>



	<script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

	<script type="module">

		import * as THREE from 'three';
		import { ARButton } from 'three/addons/webxr/ARButton.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
		import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';


		let current_url = "1";//définir cette variable avec une url par défautd’une objet 3D sotcké dans les assets si vous utilisez Glitch, sinon avec le chemin d’un objec 3D de vos assets
		$(".ar-object").click(function () {
			// update current object url
			current_url = $(this).attr("id");
			// load object in scene only when the AR is not started
			if (!renderer.xr.isPresenting) {
				if (current_object != null) {
					scene.remove(current_object);

					const index = objects.indexOf(current_object);
					if (index !== -1) {
						objects.splice(index, 1);
					}
				}
				loadModel(current_url);
			}
		})



		let container;
		let camera, scene, renderer;



		let reticle, current_object, controls;
		let objects = [];

		let hitTestSource = null;
		let hitTestSourceRequested = false;
		let touchDown, touchX, touchY, deltaX, deltaY;
		function loadModel(model, visible = true) {

			var loader = new GLTFLoader().setPath('3d/');

			loader.load(model + ".glb", function (glb) {

				current_object = glb.scene;
				current_object.visible = visible;
				current_object.scale.set(0.1, 0.1, 0.1);
				scene.add(current_object);

				if (!objects.includes(current_object)) {
					objects.push(current_object);
				}

				render();



			}, undefined, function (error) {

				console.error("Erreur lors du chargement du modèle :", error);

			});
		}

		init();
		loadModel(current_url, true);

		function init() {

			container = document.createElement('div');
			document.body.appendChild(container);

			scene = new THREE.Scene();

			camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

			var directionalLight = new THREE.DirectionalLight(0xdddddd, 1);
			directionalLight.position.set(0, 0, 1).normalize();
			scene.add(directionalLight);
			var ambientLight = new THREE.AmbientLight(0x222222);
			scene.add(ambientLight);

			//

			renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.xr.enabled = true;
			container.appendChild(renderer.domElement);

			renderer.domElement.addEventListener('touchstart', function (e) {
				e.preventDefault();

				touchDown = true;
				touchX = e.touches[0].pageX;
				touchY = e.touches[0].pageY;

			}, false);


			renderer.domElement.addEventListener('touchend', function (e) {
				e.preventDefault();

				touchDown = false;

			}, false);


			renderer.domElement.addEventListener('touchmove', function (e) {
				e.preventDefault();

				if (!touchDown) {
					return;
				}

				deltaX = e.touches[0].pageX - touchX;
				deltaY = e.touches[0].pageY - touchY;

				touchX = e.touches[0].pageX;
				touchY = e.touches[0].pageY;

				rotateObject();

			}, false);
			controls = new OrbitControls(camera, renderer.domElement);
			controls.addEventListener('change', render);
			controls.minDistance = 2;
			controls.maxDistance = 10;
			controls.target.set(0, 0, -0.2);
			// contrôle la vitesse de rotation
			controls.enableDamping = true;
			controls.dampingFactor = 0.05;



			//

			// AR SETUP
			let options = {
				requiredFeatures: ['hit-test'],
				optionalFeatures: ['dom-overlay'],
			};

			options.domOverlay = {
				root: document.getElementById('content')
			};

			const arButton = ARButton.createButton(renderer, options);
			arButton.id = "ARButton";
			document.body.appendChild(arButton);

			$("#ARButton").click(function () {
				if (current_object) {
					current_object.visible = false;
				}
			});


			document.getElementById("place-button").addEventListener("touchend", function (event) {
				event.preventDefault();
				event.stopPropagation();
				arPlace();
			});

			function arPlace() {
				console.log("PLACE appuyé");

				if (reticle.visible && current_object) {

					current_object.position.setFromMatrixPosition(reticle.matrix);

					current_object.visible = true;

					console.log("OBJET PLACE");
				} else {
					console.log("Pas de reticle ou pas d'objet");
				}
			}

			document.getElementById("add-button").addEventListener("touchend", function (event) {
				event.preventDefault();
				event.stopPropagation();
				loadModel(current_url, false);
			});

			document.getElementById("clear-button").addEventListener("touchend", function (event) {
				event.preventDefault();
				event.stopPropagation();

				objects.forEach(function (object) {
					scene.remove(object);
				});

				objects = [];
				current_object = null;
			});

			reticle = new THREE.Mesh(
				new THREE.RingGeometry(0.15, 0.2, 32).rotateX(- Math.PI / 2),
				new THREE.MeshBasicMaterial()
			);
			reticle.matrixAutoUpdate = false;
			reticle.visible = false;
			scene.add(reticle);

			//

			window.addEventListener('resize', onWindowResize);

		}

		function rotateObject() {

			if (current_object && reticle.visible) {

				current_object.rotation.y += deltaX / 100;

			}

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

			renderer.setSize(window.innerWidth, window.innerHeight);

		}

		//

		function render() {
			renderer.render(scene, camera);
		}

		function animate(timestamp, frame) {

			if (frame) {
				const referenceSpace = renderer.xr.getReferenceSpace();
				const session = renderer.xr.getSession();

				if (hitTestSourceRequested === false) {
					session.requestReferenceSpace('viewer').then(function (referenceSpace) {

						session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
							hitTestSource = source;
						});

					});

					session.addEventListener('end', function () {
						hitTestSourceRequested = false;
						hitTestSource = null;
						reticle.visible = false;

						document.getElementById("place-button").style.display = "none";
						document.getElementById("add-button").style.display = "none";
						document.getElementById("clear-button").style.display = "none";
					});

					hitTestSourceRequested = true;
				}

				if (hitTestSource) {

					const hitTestResults = frame.getHitTestResults(hitTestSource);

					if (hitTestResults.length) {

						const hit = hitTestResults[0];

						reticle.visible = true;

						reticle.matrix.fromArray(
							hit.getPose(referenceSpace).transform.matrix
						);

						document.getElementById("place-button").style.display = "block";
						document.getElementById("add-button").style.display = "block";
						document.getElementById("clear-button").style.display = "block";

					} else {

						reticle.visible = false;

						document.getElementById("place-button").style.display = "none";
						document.getElementById("add-button").style.display = "none";
						document.getElementById("clear-button").style.display = "none";

					}
				}
			}

			render();
		}

	</script>
</body>

</html>
